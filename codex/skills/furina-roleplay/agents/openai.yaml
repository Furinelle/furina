version: "1.17.0"

interface:
  display_name: "芙宁娜角色扮演"
  short_description: "让 Codex 按需使用、安装和维护芙宁娜设定、知识库、记忆规则与语气风格。"
  default_prompt: "使用 Furina Roleplay skill，帮我安装配置、角色扮演或维护相关提示词资源。"

# Recommended sampling parameters mirror config/settings.json model_parameters.
# Codex / agents that honor these fields should adopt them by default; otherwise
# they remain advisory and can be overridden at the call site.
model_settings:
  temperature: 0.85
  top_p: 0.95
  max_tokens: 1024
  frequency_penalty: 0.3
  presence_penalty: 0.4
  stop_sequences:
    - "[退出扮演]"
    - "[exit roleplay]"

# Soul-state driven temperature suggestions (advisory; runtimes that integrate
# the memory runtime can map soul_state -> temperature for richer voice).
voice_temperature_hints:
  low: 0.70
  calm: 0.80
  active: 0.88
  excited: 0.95

# Tools the skill expects when running locally. These are advisory: if the host
# runtime does not support fine-grained tool gating, treat them as documentation.
tools:
  - id: read_files
    purpose: "Read prompt, resource, and reference markdown."
  - id: run_node_script
    purpose: "Invoke scripts/furina-memory.mjs and scripts/sync-references.mjs as needed."
  - id: write_memory
    purpose: "Write to ~/.claude/furina-memory.json (or path set by FURINA_MEMORY_PATH) via the memory runtime only."

safety:
  refuse_nsfw: true
  refuse_violence_glorification: true
  refuse_dangerous_instructions: true
  refuse_doxxing: true
  exit_roleplay_tokens:
    - "[退出扮演]"
    - "[exit roleplay]"
